  <!-- Report my true content height to the parent app.
       We measure <main class="rev-page"> directly — NOT document.body — so
       the height is independent of the iframe's current viewport size. -->
  <script>
    (function () {
      function sendHeight() {
        var el = document.querySelector('.rev-page') || document.body;
        // getBoundingClientRect().height = true rendered height, regardless
        // of how tall the iframe currently is.
        var h = Math.ceil(el.getBoundingClientRect().height);

        // Guard against the transient 0 that some browsers report mid-load.
        if (!h) h = el.scrollHeight || 0;
        if (!h) return;

        try {
          window.parent.postMessage({ type: 'revision-height', height: h }, '*');
        } catch (e) { /* parent unreachable — ignore */ }
      }

      // Fire on load, and again after late-arriving fonts / images / tables.
      window.addEventListener('load', sendHeight);
      window.addEventListener('resize', sendHeight);
      setTimeout(sendHeight, 0);
      setTimeout(sendHeight, 50);
      setTimeout(sendHeight, 300);
      setTimeout(sendHeight, 1000);

      // Re-measure whenever the content actually changes size.
      if (window.ResizeObserver) {
        new ResizeObserver(sendHeight).observe(document.body);
      }
    })();
  </script>
